<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Colours follow the app's dark theme tokens (public/style.css): zinc surfaces, white ink,
       status green / yellow / red. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27272a"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>
  <rect x="104" y="104" width="816" height="816" rx="182" fill="none" stroke="#3f3f46" stroke-width="8"/>
  <g filter="url(#shadow)">
    <rect x="210" y="250" width="540" height="420" rx="58" fill="#09090b" stroke="#3f3f46" stroke-width="6"/>
    <circle cx="272" cy="308" r="15" fill="#f87171"/>
    <circle cx="318" cy="308" r="15" fill="#fbbf24"/>
    <circle cx="364" cy="308" r="15" fill="#34d399"/>
    <path d="M290 420l86 66-86 66" fill="none" stroke="#fafafa" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M420 556h130" stroke="#71717a" stroke-width="36" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="580" y="560" width="250" height="230" rx="40" fill="url(#crate)"/>
    <path d="M630 620v110M680 620v110M730 620v110M780 620v110" stroke="#18181b" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
